[package]
name = "todo-app-desktop"
version = "0.1.0"
description = "Todo App desktop shell"
authors = ["Todo App contributors"]
edition = "2021"

[lib]
name = "todo_app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
task-core = { path = "../../../crates/task-core" }
task-store = { path = "../../../crates/task-store" }
llm-provider = { path = "../../../crates/llm-provider" }
